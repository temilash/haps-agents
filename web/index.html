<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAPS Replay</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #111418;
    --panel: #181c22;
    --line: #2a3039;
    --text: #e6e9ee;
    --muted: #8b95a3;
    --accent: #5fb3ff;
    --ok: #4c9be8;
    --warn: #f2c94c;
    --bad: #eb5757;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: auto 1fr; height: 100vh; }
  #controls { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #controls label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  select, button { background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 8px; font: inherit; }
  button { cursor: pointer; min-width: 72px; }
  button:hover, select:hover { border-color: var(--accent); }
  #slider { flex: 1 1 200px; accent-color: var(--accent); }
  #clock { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 48px; }
  #map { min-height: 0; background: var(--bg); }
  #panel { overflow-y: auto; padding: 14px 16px; background: var(--panel); border-left: 1px solid var(--line); }
  #panel h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 14px 0 6px; }
  #panel h2:first-child { margin-top: 0; }
  .stat { display: flex; justify-content: space-between; padding: 3px 0;
    font-variant-numeric: tabular-nums; }
  .stat span:first-child { color: var(--muted); }
  .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .haps-row { display: grid; grid-template-columns: 34px 1fr 54px; gap: 8px; align-items: center; padding: 4px 0; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  .mode-low { color: var(--warn); }
  #legend { background: rgba(17,20,24,.88); color: var(--text); padding: 8px 10px; border-radius: 6px;
    font-size: 12px; min-width: 170px; }
  #legend .ramp { height: 10px; border-radius: 2px; margin: 6px 0 2px; }
  #legend .ticks { display: flex; justify-content: space-between; color: var(--muted); }
  .hub-label { color: #c9d1dc; font-size: 11px; white-space: nowrap; text-shadow: 0 0 3px #000, 0 0 3px #000; }
  .gw { width: 10px; height: 10px; background: #fff; border: 2px solid #111; }
  .haps { width: 14px; height: 14px; background: var(--accent); border: 2px solid #fff; transform: rotate(45deg); }
  .haps.low { background: var(--warn); }
  .haps-label { color: #fff; font-size: 11px; font-weight: 600; white-space: nowrap;
    text-shadow: 0 0 3px #000, 0 0 3px #000; }
  #error { color: var(--bad); }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto 60vh auto; height: auto; }
    #panel { border-left: 0; border-top: 1px solid var(--line); }
    #controls { padding: 8px 16px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="controls">
    <label>Run <select id="run"></select></label>
    <button id="play" type="button">Play</button>
    <label>Speed
      <select id="speed"><option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option></select>
    </label>
    <span id="clock">--:--</span>
    <input id="slider" type="range" min="0" max="0" value="0" aria-label="Time">
    <label>Colour by
      <select id="metric">
        <option value="demand">Demand</option>
        <option value="overflow" selected>Overflow</option>
        <option value="served">% served</option>
      </select>
    </label>
  </div>
  <div id="map"></div>
  <div id="panel">
    <h2>Sim time</h2>
    <div class="big" id="p-time">--:--</div>
    <h2>Service</h2>
    <div class="stat"><span>% served</span><span id="p-served">–</span></div>
    <div class="stat"><span>% critical served</span><span id="p-crit">–</span></div>
    <div class="stat"><span>Unserved critical</span><span id="p-uc">–</span></div>
    <div class="stat"><span>Unserved general</span><span id="p-ug">–</span></div>
    <div class="stat"><span>Demand</span><span id="p-demand">–</span></div>
    <h2>HAPS</h2>
    <div id="p-haps"></div>
    <div id="error"></div>
  </div>
</div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
const REGION = params.get("region") || "england";
const BASE = `data/${REGION}`;

// Sequential ramp (dark to bright), readable on the dark basemap.
const RAMP = ["#1b2a49", "#24497a", "#2a6f97", "#2c9c95", "#5cc46a", "#c9de45", "#fde725"];
const METRICS = {
  demand:   { idx: 0, label: "Demand (Mbps, log)", log: true, min: 1, max: 1e5 },
  overflow: { idx: 1, label: "Overflow (Mbps, log)", log: true, min: 1, max: 1e4 },
  served:   { idx: 2, label: "% served", log: false, min: 50, max: 100, reverse: true },
};

function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
const RAMP_RGB = RAMP.map(hexToRgb);
function rampColor(t) {
  t = Math.min(1, Math.max(0, t)) * (RAMP.length - 1);
  const i = Math.min(RAMP.length - 2, Math.floor(t)), f = t - i;
  const a = RAMP_RGB[i], b = RAMP_RGB[i + 1];
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",")})`;
}
function metricT(m, v) {
  if (m.log) {
    if (!(v > 0)) return null;
    return (Math.log10(v) - Math.log10(m.min)) / (Math.log10(m.max) - Math.log10(m.min));
  }
  const t = (v - m.min) / (m.max - m.min);
  return m.reverse ? 1 - t : t;
}
function fmtMbps(v) {
  if (v >= 1e6) return (v / 1e6).toFixed(2) + " Tbps";
  if (v >= 1e3) return (v / 1e3).toFixed(1) + " Gbps";
  return v.toFixed(1) + " Mbps";
}
function linkColor(u) { return u > 0.8 ? "#eb5757" : u >= 0.5 ? "#f2c94c" : "#4c9be8"; }

const map = L.map("map", { preferCanvas: true, zoomControl: true, zoomSnap: 0.25 });
// CARTO's dark tiles now return an "API key required" image without a key,
// so Esri's dark canvas is the default; ?basemap=carto switches back.
const BASEMAPS = {
  esri: ["https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}",
         { attribution: "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors", maxZoom: 16 }],
  carto: ["https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
          { attribution: "&copy; OpenStreetMap contributors &copy; CARTO", subdomains: "abcd", maxZoom: 12 }],
};
L.tileLayer(...(BASEMAPS[params.get("basemap")] || BASEMAPS.esri)).addTo(map);
const renderer = L.canvas({ padding: 0.3 });

const state = { frames: [], i: 0, playing: false, timer: null, metric: "overflow", cells: {}, static: null };
const hapsLayer = L.layerGroup().addTo(map);
const linkLayer = L.layerGroup().addTo(map);

const legend = L.control({ position: "bottomleft" });
legend.onAdd = () => { const d = L.DomUtil.create("div"); d.id = "legend"; return d; };
legend.addTo(map);
function drawLegend() {
  const m = METRICS[state.metric];
  const stops = (m.reverse ? [...RAMP].reverse() : RAMP).join(",");
  const ticks = m.log ? [m.min, Math.sqrt(m.min * m.max), m.max].map(v => v >= 1000 ? (v / 1000) + "k" : v)
                      : [m.min, (m.min + m.max) / 2, m.max];
  document.getElementById("legend").innerHTML =
    `<div>${m.label}</div><div class="ramp" style="background:linear-gradient(90deg,${stops})"></div>` +
    `<div class="ticks">${ticks.map(t => `<span>${t}</span>`).join("")}</div>`;
}

async function getJSON(path) {
  const r = await fetch(`${BASE}/${path}`);
  if (!r.ok) throw new Error(`${r.status} loading ${BASE}/${path}`);
  return r.json();
}

async function loadStatic() {
  const [cells, st] = await Promise.all([getJSON("cells.geojson"), getJSON("static.json")]);
  state.static = st;
  const layer = L.geoJSON(cells, {
    renderer,
    style: { weight: 0.3, color: "#0b0d10", fillOpacity: 0.75, fillColor: "#1b2a49" },
    onEachFeature: (f, l) => { state.cells[f.properties.cell_id] = l; l.feature = f; },
  }).addTo(map);
  layer.bindTooltip(l => {
    const p = l.feature.properties, v = currentCell(p.cell_id);
    const extra = v ? `<br>demand ${fmtMbps(v[0])}<br>overflow ${fmtMbps(v[1])}<br>${v[2]}% served` : "";
    return `${p.area_type}${p.hub ? " · " + p.hub : ""}<br>pop ${p.population.toLocaleString()}${extra}`;
  }, { sticky: true });
  map.fitBounds(layer.getBounds(), { padding: [10, 10] });

  for (const [a, b] of st.backbone) {
    L.polyline([a, b], { color: "#9aa7b8", weight: 1, opacity: 0.35, interactive: false }).addTo(map);
  }
  for (const h of st.hubs) {
    L.marker([h.lat, h.lon], { interactive: false,
      icon: L.divIcon({ className: "", html: `<div class="hub-label">${h.name}</div>`, iconAnchor: [-4, 6] }) }).addTo(map);
  }
  for (const g of st.gateways) {
    L.marker([g.lat, g.lon], { title: g.id,
      icon: L.divIcon({ className: "", html: '<div class="gw"></div>', iconSize: [10, 10], iconAnchor: [5, 5] }) })
      .bindTooltip(`Gateway ${g.id}`).addTo(map);
  }
}

function currentCell(id) { const f = state.frames[state.i]; return f ? f.cells[id] : null; }

function render() {
  const f = state.frames[state.i];
  if (!f) return;
  const m = METRICS[state.metric];
  for (const [id, layer] of Object.entries(state.cells)) {
    const v = f.cells[id];
    const t = v ? metricT(m, v[m.idx]) : null;
    layer.setStyle(t === null ? { fillColor: "#151a21", fillOpacity: 0.35 } : { fillColor: rampColor(t), fillOpacity: 0.75 });
  }

  linkLayer.clearLayers();
  for (const l of f.links) {
    L.polyline([l.a, l.b], { color: linkColor(l.util), weight: l.type === "feeder" ? 2.5 : 2,
      opacity: 0.9, interactive: true }).bindTooltip(`${l.type} · ${(100 * l.util).toFixed(0)}%`).addTo(linkLayer);
  }
  hapsLayer.clearLayers();
  const km = state.static.coverage_km;
  for (const h of f.haps) {
    L.circle([h.lat, h.lon], { radius: km * 1000, color: "#5fb3ff", weight: 1, opacity: 0.6,
      fillOpacity: 0.06, interactive: false }).addTo(hapsLayer);
    if (Math.abs(h.target_lat - h.lat) + Math.abs(h.target_lon - h.lon) > 1e-3) {
      L.polyline([[h.lat, h.lon], [h.target_lat, h.target_lon]], { color: "#5fb3ff", weight: 1.2,
        opacity: 0.6, dashArray: "4 4", interactive: false }).addTo(hapsLayer);
    }
    L.marker([h.lat, h.lon], { icon: L.divIcon({ className: "",
      html: `<div class="haps ${h.mode === "low" ? "low" : ""}"></div>`, iconSize: [14, 14], iconAnchor: [7, 7] }) })
      .bindTooltip(`${h.id} · ${h.battery}% · ${h.mode}`).addTo(hapsLayer);
    L.marker([h.lat, h.lon], { interactive: false, icon: L.divIcon({ className: "",
      html: `<div class="haps-label">${h.id} ${Math.round(h.battery)}%</div>`, iconAnchor: [-10, 18] }) }).addTo(hapsLayer);
  }

  const t = f.totals;
  document.getElementById("clock").textContent = f.t;
  document.getElementById("p-time").textContent = f.t;
  document.getElementById("p-served").textContent = t.pct_served.toFixed(3) + "%";
  document.getElementById("p-crit").textContent = t.pct_critical_served.toFixed(3) + "%";
  document.getElementById("p-uc").textContent = fmtMbps(t.unserved_critical_mbps);
  document.getElementById("p-ug").textContent = fmtMbps(t.unserved_general_mbps);
  document.getElementById("p-demand").textContent = fmtMbps(t.demand_mbps);
  document.getElementById("p-haps").innerHTML = f.haps.map(h => `
    <div class="haps-row"><strong>${h.id}</strong>
      <div class="bar" title="${h.battery}%"><div style="width:${h.battery}%;${h.mode === "low" ? "background:var(--warn)" : ""}"></div></div>
      <span class="${h.mode === "low" ? "mode-low" : ""}">${Math.round(h.battery)}% ${h.mode === "low" ? "low" : ""}</span>
    </div>`).join("");
  document.getElementById("slider").value = state.i;
}

function setPlaying(on) {
  state.playing = on;
  document.getElementById("play").textContent = on ? "Pause" : "Play";
  clearInterval(state.timer);
  if (on) {
    const fps = Number(document.getElementById("speed").value);
    state.timer = setInterval(() => {
      if (state.i >= state.frames.length - 1) { setPlaying(false); return; }
      state.i += 1; render();
    }, 1000 / fps);
  }
}

async function loadRun(runId) {
  setPlaying(false);
  const run = await getJSON(`runs/${runId}.json`);
  state.frames = run.frames;
  state.i = Math.min(state.i, run.frames.length - 1);
  const slider = document.getElementById("slider");
  slider.max = run.frames.length - 1;
  render();
}

async function main() {
  try {
    await loadStatic();
    drawLegend();
    const index = await getJSON("runs/index.json");
    const sel = document.getElementById("run");
    sel.innerHTML = index.map(r => `<option value="${r.run_id}">${r.controller} · ${r.run_id}</option>`).join("");
    if (!index.length) throw new Error("No exported runs; see README.");
    const wanted = params.get("run");
    if (wanted) sel.value = wanted;
    sel.onchange = () => loadRun(sel.value);
    document.getElementById("play").onclick = () => setPlaying(!state.playing);
    document.getElementById("speed").onchange = () => { if (state.playing) setPlaying(true); };
    document.getElementById("slider").oninput = e => { state.i = Number(e.target.value); render(); };
    document.getElementById("metric").onchange = e => { state.metric = e.target.value; drawLegend(); render(); };
    const frame = Number(params.get("frame"));
    if (frame) state.i = frame;
    await loadRun(sel.value);
  } catch (err) {
    document.getElementById("error").textContent = String(err.message || err);
  }
}
main();
</script>
</body>
</html>
